# This workflow will build and push a node.js application to an Azure Web App when a commit is pushed to your default branch.
#
# This workflow assumes you have already created the target Azure App Service web app.
# For instructions see https://docs.microsoft.com/en-us/azure/app-service/quickstart-nodejs?tabs=linux&pivots=development-environment-cli
#
# To configure this workflow:
#
# 1. Download the Publish Profile for your Azure Web App. You can download this file from the Overview page of your Web App in the Azure Portal.
#    For more information: https://docs.microsoft.com/en-us/azure/app-service/deploy-github-actions?tabs=applevel#generate-deployment-credentials
#
# 2. Create a secret in your repository named AZURE_WEBAPP_PUBLISH_PROFILE, paste the publish profile contents as the value of the secret.
#    For instructions on obtaining the publish profile see: https://docs.microsoft.com/azure/app-service/deploy-github-actions#configure-the-github-secret
#
# 3. Change the value for the AZURE_WEBAPP_NAME. Optionally, change the AZURE_WEBAPP_PACKAGE_PATH and NODE_VERSION environment variables below.
#
# For more information on GitHub Actions for Azure: https://github.com/Azure/Actions
# For more information on the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# For more samples to get started with GitHub Action workflows to deploy to Azure: https://github.com/Azure/actions-workflow-samples

name: Build and deploy precon-platform-ui app to an Azure Web App

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main

env:
  AZURE_WEBAPP_NAME: PreconIQUI-dev    # set this to your application's name
  AZURE_WEBAPP_PACKAGE_PATH: 'precon-platform-ui'      # set this to the path to your web app project, defaults to the repository root
  NODE_VERSION: '20.x'                # set this to the node version to use

permissions:
  id-token: write
  contents: read

jobs:
  set-environment:
    runs-on: ubuntu-latest-qco
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      webapp-name: ${{ steps.set-env.outputs.webapp-name }}
    steps:
      - name: Determine environment
        id: set-env
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "environment=bla-pcp-ts-rg" >> $GITHUB_OUTPUT
            echo "webapp-name=PreconIQUI-test" >> $GITHUB_OUTPUT
          else
            echo "environment=bla-pcp-dv-rg" >> $GITHUB_OUTPUT
            echo "webapp-name=PreconIQUI-dev" >> $GITHUB_OUTPUT
          fi

  build:
    needs: set-environment
    environment: ${{ needs.set-environment.outputs.environment }}
    runs-on: ubuntu-latest-qco

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: '${{ env.AZURE_WEBAPP_PACKAGE_PATH }}/package-lock.json'

    - name: Create production environment file
      working-directory: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
      run: |
        echo "REACT_APP_API_BASE_URL=${{ vars.PRECONIQAPIURL }}" > .env.production
        echo "REACT_APP_MSAL_TENANT_ID=${{ vars.AZURE_TENANT_ID }}" >> .env.production
        echo "REACT_APP_MSAL_CLIENT_ID=${{ vars.MSAL_CLIENT_ID }}" >> .env.production
        echo "REACT_APP_MSAL_API_CLIENT_ID=${{ vars.MSAL_API_CLIENT_ID }}" >> .env.production
        echo "REACT_APP_MSAL_REDIRECT_URL=${{ vars.MSAL_REDIRECT_URL }}" >> .env.production

    - name: npm install and build
      working-directory: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
      run: |
        npm install
        npm run build --if-present

    - name: Upload artifact for deployment job
      uses: actions/upload-artifact@v4
      with:
        name: node-app
        path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}/build

  deploy:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest-qco
    needs: [build, set-environment]
    environment:
      name: ${{ needs.set-environment.outputs.environment }}
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Azure Login
      uses: azure/login@v2
      with:
        client-id: ${{ vars.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    - name: Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: node-app

    - name: 'Deploy to Azure WebApp'
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ needs.set-environment.outputs.webapp-name }}
        package: .